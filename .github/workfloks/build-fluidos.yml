name: Construir FluidOS Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-fluidos.yml'
      - 'build-os.sh'
      - 'setup-features.sh'
      - 'setup-desktop.sh'
      - 'make-iso.sh'
      - 'desktop/**'
      - 'mfsbsd/**'

permissions:
  contents: write

concurrency:
  group: fluidos-live-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-freebsd-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar el repositorio FluidOS
        uses: actions/checkout@v4

      - name: Construir la ISO dentro de FreeBSD 14.5
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          mem: 4G
          usesh: true
          sync: rsync
          copyback: true
          run: |
            set -eu

            REPO_DIR=$(find "$GITHUB_WORKSPACE" -type f -name build-os.sh -print -quit | xargs dirname)
            if [ -z "$REPO_DIR" ] || [ ! -f "$REPO_DIR/build-os.sh" ]; then
              echo "[ERROR] No se encuentra build-os.sh"
              exit 1
            fi

            cd "$REPO_DIR"
            chmod +x build-os.sh setup-features.sh setup-desktop.sh make-iso.sh

            echo "========== 1/3: BASE Y HERRAMIENTAS =========="
            ./build-os.sh

            echo "========== 2/3: ESCRITORIO Y CONFIGURACION =========="
            ./setup-features.sh

            echo "========== 3/3: ISO BIOS + UEFI =========="
            ./make-iso.sh

            test -s "$REPO_DIR/fluidos-14.5-amd64.iso"
            ls -lh "$REPO_DIR/fluidos-14.5-amd64.iso"

      - name: Comprimir ISO y generar SHA256
        shell: bash
        run: |
          set -euo pipefail
          ISO=$(find "$GITHUB_WORKSPACE" -type f -name 'fluidos-14.5-amd64.iso' -print -quit)
          if [[ -z "$ISO" || ! -s "$ISO" ]]; then
            echo "No se encontro una ISO valida"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          COMPRESSED="$GITHUB_WORKSPACE/release-assets/fluidos-14.5-amd64.iso.xz"
          echo "[INFO] Comprimiendo ISO con dos hilos para limitar memoria..."
          xz -T2 -6 -c "$ISO" > "$COMPRESSED"
          cd "$GITHUB_WORKSPACE/release-assets"
          sha256sum fluidos-14.5-amd64.iso.xz > fluidos-14.5-amd64.iso.xz.sha256
          sha256sum -c fluidos-14.5-amd64.iso.xz.sha256

          SIZE=$(stat -c%s "$COMPRESSED")
          LIMIT=1900M
          echo "[INFO] Tamano comprimido: $SIZE bytes"
          if (( SIZE > 1992294400 )); then
            echo "[INFO] Dividiendo el archivo para los limites de GitHub Releases..."
            split -b "$LIMIT" -d -a 3 "$COMPRESSED" "$COMPRESSED.part"
            rm -f "$COMPRESSED"
          fi
          ls -lh "$GITHUB_WORKSPACE/release-assets"

      - name: Guardar ISO como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: FluidOS-14.5-Live-ISO
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publicar ISO en GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.0-beta
          name: FluidOS 1.0 Beta
          overwrite_files: true
          generate_release_notes: true
          body: |
            ## FluidOS 1.0 Beta - Live ISO

            Imagen de prueba BIOS + UEFI construida con FreeBSD 14.5 y mfsBSD.

            **Solo para pruebas en maquina virtual.** No es todavia un instalador de disco ni una version lista para distribuir.

            Usuario de prueba: `fluid`
            Clave de prueba: `fluidos`

            SSH esta desactivado. Cambia las claves y revisa la seguridad antes de cualquier distribucion publica.

            En caso de archivos .part, descarga todas las partes y unelas en orden:
            `cat fluidos-14.5-amd64.iso.xz.part* > fluidos-14.5-amd64.iso.xz`
            Despues verifica el archivo con SHA256 y descomprime XZ.
          files: |
            release-assets/*
          fail_on_unmatched_files: true
